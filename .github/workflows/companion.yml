name: Companion

# The phone companion: the node side's tests, the Android packages and the
# Flatpak. Runs when the companion, the overlay it rides on or the app
# change, and by hand.
#
# The APKs come out unsigned and are kept as workflow artifacts only. They
# are signed offline with the release key, never here.

on:
  push:
    paths:
      - 'mobile/**'
      - 'src/companion/**'
      - 'src/overlay/**'
      - 'src/wallet/companion.cpp'
      - 'src/rpc/companion.cpp'
      - 'test/functional/feature_companion.py'
      - '.github/workflows/companion.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/companion/**'
      - 'src/overlay/**'
      - 'src/wallet/companion.cpp'
      - 'src/rpc/companion.cpp'
      - 'test/functional/feature_companion.py'
      - '.github/workflows/companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node side (unit and functional tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config bison \
            curl bsdmainutils python3

      # Boost, libevent and Berkeley DB 4.8 as the releases have them.
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: depends-noqt-x86_64-linux-gnu-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/hosts/*.mk', 'depends/builders/*.mk', 'depends/funcs.mk', 'depends/Makefile') }}

      - name: Build depends
        run: make -C depends HOST=x86_64-linux-gnu NO_QT=1 -j$(nproc)

      - name: Configure
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-linux-gnu/share/config.site" \
            ./configure --without-gui --disable-bench --disable-fuzz-binary

      - name: Build
        run: make -j$(nproc)

      - name: Unit tests
        run: src/test/test_bitcoin --run_test=cells_tests,overlay_tests,mail_tests,companion_tests

      - name: Functional tests
        run: test/functional/test_runner.py --jobs=2 feature_companion.py feature_mail.py

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      WORK: /home/runner/bps-mobile
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Qt for the host and for this ABI take most of the time and only change
      # with the build script.
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK }}/dl
            ${{ env.WORK }}/qt-*
            ${{ env.WORK }}/deps-*
            ${{ env.WORK }}/build/host/.done-*
            ${{ env.WORK }}/build/android-${{ matrix.abi }}/.done-*
          key: qt-android-${{ matrix.abi }}-${{ hashFiles('mobile/tools/android.sh') }}

      - name: Build
        run: mobile/tools/android.sh ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: bps-companion-${{ matrix.abi }}-unsigned
          path: ${{ env.WORK }}/out/*.apk
          if-no-files-found: error

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and the KDE runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo \
            build mobile/flatpak/org.bps.companion.yml
          flatpak build-bundle repo bps-companion-x86_64.flatpak org.bps.companion \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: bps-companion-x86_64-flatpak
          path: bps-companion-x86_64.flatpak
          if-no-files-found: error
