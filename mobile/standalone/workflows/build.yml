name: Build

# Every push and pull request: the client core and test client on Linux, the
# Android packages and the Flatpak. The APKs come out unsigned and stay
# workflow artifacts; releases are signed offline (RELEASING.md).

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Client core and bps-companion-cli (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Build
        run: |
          cmake -S core -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          test -x build-core/bps-companion-cli

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      WORK: /home/runner/bps-mobile
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Qt for the host and for this ABI take most of the time and only change
      # with the build script.
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK }}/dl
            ${{ env.WORK }}/qt-*
            ${{ env.WORK }}/deps-*
            ${{ env.WORK }}/build/host/.done-*
            ${{ env.WORK }}/build/android-${{ matrix.abi }}/.done-*
          key: qt-android-${{ matrix.abi }}-${{ hashFiles('tools/android.sh') }}

      - name: Build
        run: tools/android.sh ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: bps-companion-${{ matrix.abi }}-unsigned
          path: ${{ env.WORK }}/out/*.apk
          if-no-files-found: error

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and the KDE runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo \
            build flatpak/org.bps.companion.yml
          flatpak build-bundle repo bps-companion-x86_64.flatpak org.bps.companion \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: bps-companion-x86_64-flatpak
          path: bps-companion-x86_64.flatpak
          if-no-files-found: error
