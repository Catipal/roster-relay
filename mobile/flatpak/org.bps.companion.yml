# BPS Companion as a Flatpak: Linux phones (postmarketOS, Mobian, Plasma
# Mobile) and desktops, aarch64 and x86_64.
#
#   flatpak-builder --user --install --force-clean build mobile/flatpak/org.bps.companion.yml
#
# run from the top of the tree. The app is written to the Qt 6.8 API, so the
# KDE runtime's Qt serves; it need not be the 6.12 the APK carries.
id: org.bps.companion
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: bps-companion
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The camera, for scanning codes. Qt Multimedia reads /dev/video* directly.
  - --device=all
  # The device key, kept in the desktop's keyring rather than a file.
  - --talk-name=org.freedesktop.secrets
  # Pictures of codes to choose from, where there is no camera.
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - '*.a'
modules:
  - name: zxing-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DZXING_READERS=ON
      - -DZXING_WRITERS=OLD
      - -DZXING_EXAMPLES=OFF
      - -DZXING_BLACKBOX_TESTS=OFF
      - -DZXING_UNIT_TESTS=OFF
      - -DZXING_PYTHON_MODULE=OFF
      # The C wrapper is not used, and fetches stb from the network.
      - -DZXING_C_API=OFF
      # The SDK has Doxygen, and finding it makes the docs fetch a stylesheet
      # from the network, which a Flatpak build does not have.
      - -DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=ON
    sources:
      - type: archive
        url: https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v3.1.1.tar.gz
        sha256: 7286b1e6ade66fe82b7c8208b4595deeb55d6486b410834fdc65702f46650542

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.17.0.tar.gz
        sha256: 3b85c3929034b0a99da777130c34d99f006fcd3a9d56564159399a33fee0e504

  - name: bps-companion
    buildsystem: cmake-ninja
    subdir: mobile/app
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      # The tree this file sits in. A release build names a git tag instead:
      #   - type: git
      #     url: <the project's repository>
      #     tag: <the release tag>
      - type: dir
        path: ../..
        skip:
          - build
          - .flatpak-builder
          - depends
          - mobile/flatpak/build
