name: Release

# A tag v<version> builds every package and opens a draft release holding
# them. The APKs in it are unsigned: sign them offline, replace them and
# publish, as RELEASING.md describes. Nothing here ever sees the release key.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: Tag matches the app's version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^project\(bps_companion_app VERSION ${version//./\\.} " app/CMakeLists.txt || {
            echo "::error::app/CMakeLists.txt does not say VERSION $version"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android (${{ matrix.abi }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      WORK: /home/runner/bps-mobile
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libegl-dev
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK }}/dl
            ${{ env.WORK }}/qt-*
            ${{ env.WORK }}/deps-*
            ${{ env.WORK }}/build/host/.done-*
            ${{ env.WORK }}/build/android-${{ matrix.abi }}/.done-*
          key: qt-android-${{ matrix.abi }}-${{ hashFiles('tools/android.sh') }}
      - name: Build
        run: |
          tools/android.sh ${{ matrix.abi }}
          mv "$WORK/out/bps-companion-${{ matrix.abi }}-unsigned.apk" \
             "$WORK/out/bps-companion-${{ needs.check.outputs.version }}-${{ matrix.abi }}-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ env.WORK }}/out/*.apk
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and the KDE runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo \
            build flatpak/org.bps.companion.yml
          flatpak build-bundle repo bps-companion-${{ needs.check.outputs.version }}-${{ matrix.arch }}.flatpak \
            org.bps.companion --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: '*.flatpak'
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [check, android, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the changelog
        run: |
          version="${{ needs.check.outputs.version }}"
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install:** see the [README](https://github.com/${{ github.repository }}#install)."
            echo
            echo "**Signing certificate SHA-256:** (added when the signed packages are uploaded)"
          } >> notes.md
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "BPS Companion ${{ needs.check.outputs.version }}" \
            --notes-file notes.md dist/*
